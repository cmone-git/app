<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Page Not Found | CM TaxApp</title>
    <meta name="theme-color" content="#111827">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { primary: '#c80000', bg: '#F8FAFC' } }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-brand-bg min-h-screen flex flex-col items-center justify-center p-5">

    <div class="w-full max-w-[400px] text-center">
        <!-- 404 Illustration -->
        <div class="relative w-32 h-32 mx-auto mb-6">
            <div class="absolute inset-0 bg-red-100 rounded-full animate-pulse opacity-50"></div>
            <div class="absolute inset-0 flex items-center justify-center text-brand-primary">
                <i data-lucide="file-question" class="w-16 h-16 relative z-10"></i>
            </div>
        </div>

        <h1 class="text-6xl font-black text-gray-900 tracking-tight mb-2">404</h1>
        <h2 class="text-xl font-bold text-gray-800 mb-3">Page Not Found</h2>
        <p class="text-sm text-gray-500 mb-8 leading-relaxed">
            The document or service you are looking for has been moved or does not exist. 
        </p>

        <a href="index.html" class="w-full inline-flex items-center justify-center gap-2 bg-gray-900 text-white font-bold py-4 rounded-xl shadow-md hover:bg-black transition text-sm">
            <i data-lucide="home" class="w-4 h-4"></i> Back to Dashboard
        </a>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
