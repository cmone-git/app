<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CM BUSINESS FLOW</title>

  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            navy: '#071d49',
            'navy-soft': '#102a5c',
            yellow: '#ffc51b',
            'yellow-dark': '#eab000',
            gray: '#f1f2f7',
            text: '#071d49',
          },
          boxShadow: {
            custom: '0 24px 45px rgba(7, 29, 73, .18)',
          }
        }
      }
    };
  </script>

  <!-- CSS Variables & Base Styles -->
  <style>
    :root {
      --navy: #071d49;
      --navy-soft: #102a5c;
      --yellow: #ffc51b;
      --yellow-dark: #eab000;
      --white: #ffffff;
      --gray: #f1f2f7;
      --text: #071d49;
      --shadow: 0 24px 45px rgba(7, 29, 73, .18);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--gray);
      color: var(--text);
      font-size: 18px; 
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Header Area -->
    <div class="text-center mb-8 flex flex-col items-center">
      <a href="index.html"
         class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-navy text-yellow shadow-md shadow-navy/20 mb-4 transition-transform hover:scale-105">
        <i data-lucide="lock-keyhole" style="width: 32px; height: 32px;"></i>
      </a>
      <h1 class="text-2xl font-extrabold text-navy tracking-tight">Client Hub CRM</h1>
      <p class="text-sm font-medium text-navy-soft mt-1">Firebase Edition</p>
    </div>

    <!-- Main Auth Card: Round 1 (rounded-3xl) -->
    <div class="bg-white rounded-3xl border border-gray/60 shadow-custom overflow-hidden">

      <div class="p-6 sm:p-8 border-b border-gray/60 bg-white">
        <h2 id="title" class="text-xl font-extrabold text-navy">Sign In</h2>
        <p id="subtitle" class="text-sm text-navy-soft mt-1.5">Secure access to your CRM workspace.</p>
      </div>

      <div class="p-6 sm:p-8">

        <!-- Tabs Container: Round 2 (rounded-2xl) -->
        <div class="flex items-center bg-gray p-1.5 rounded-2xl border border-gray/80 mb-6">
          <button id="signinTab" type="button"
            class="flex-1 px-4 py-2.5 rounded-xl text-sm font-bold bg-white text-navy shadow-sm transition-all">
            Sign In
          </button>
          <button id="signupTab" type="button"
            class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-navy-soft hover:text-navy transition-all">
            Sign Up
          </button>
        </div>

        <form id="authForm" class="space-y-5">

          <!-- Email Input -->
          <div>
            <label class="block text-xs font-bold text-navy-soft uppercase tracking-wider mb-2">Email Address</label>
            <input id="email" type="email" required
              class="w-full px-4 py-3 text-sm bg-gray border border-gray/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-navy focus:bg-white text-navy transition-all"
              placeholder="you@example.com">
          </div>

          <!-- Password Input -->
          <div>
            <label class="block text-xs font-bold text-navy-soft uppercase tracking-wider mb-2">Password</label>
            <input id="password" type="password" required minlength="6"
              class="w-full px-4 py-3 text-sm bg-gray border border-gray/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-navy focus:bg-white text-navy transition-all"
              placeholder="Minimum 6 characters">
          </div>

          <!-- Confirm Password (Hidden by default) -->
          <div id="confirmGroup" class="hidden">
            <label class="block text-xs font-bold text-navy-soft uppercase tracking-wider mb-2">Confirm Password</label>
            <input id="confirmPassword" type="password" minlength="6"
              class="w-full px-4 py-3 text-sm bg-gray border border-gray/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-navy focus:bg-white text-navy transition-all"
              placeholder="Repeat password">
          </div>

          <!-- Alert Message Area -->
          <div id="message" class="hidden text-sm px-4 py-3 rounded-xl font-medium"></div>

          <!-- Submit Button (Yellow Minimal) -->
          <button id="submitBtn" type="submit"
            class="w-full flex items-center justify-center gap-2 bg-yellow hover:bg-yellow-dark disabled:opacity-50 text-navy text-base font-bold px-4 py-3.5 rounded-xl shadow-sm transition-colors cursor-pointer mt-2">
            <span>Sign In</span>
            <i data-lucide="arrow-right" style="width: 20px; height: 20px;"></i>
          </button>

        </form>

        <div class="mt-8 text-center">
          <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-navy-soft hover:text-navy transition-colors">
            <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
            Back to public dashboard
          </a>
        </div>

      </div>
    </div>

    <p class="text-center text-xs font-medium text-navy-soft/60 mt-6 flex items-center justify-center gap-1.5">
      <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i>
      Secure authentication powered by Firebase
    </p>

  </div>

  <!-- FIREBASE AUTH LOGIC -->
  <script type="module">
    // Make sure your path to auth.js matches your actual project structure
    import { watchAuth, login, signup, saveUserProfile } from "./js/auth.js";

    // Initialize Lucide Icons
    lucide.createIcons();

    const $ = id => document.getElementById(id);

    let mode = new URLSearchParams(location.search).get("mode") === "signup"
      ? "signup"
      : "signin";

    // Tab Style Constants
    const activeTabClass = "flex-1 px-4 py-2.5 rounded-xl text-sm font-bold bg-white text-navy shadow-sm transition-all";
    const inactiveTabClass = "flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-navy-soft hover:text-navy transition-all";

    function setMode(nextMode) {
      mode = nextMode;
      const signupMode = mode === "signup";

      $("title").textContent = signupMode ? "Create Account" : "Sign In";
      $("subtitle").textContent = signupMode
        ? "Create your secure CRM account."
        : "Secure access to your CRM workspace.";

      // Update button text but keep the icon
      $("submitBtn").innerHTML = `
        <span>${signupMode ? "Create Account" : "Sign In"}</span>
        <i data-lucide="arrow-right" style="width: 20px; height: 20px;"></i>
      `;
      lucide.createIcons(); // Re-render the icon inside the button

      $("confirmGroup").classList.toggle("hidden", !signupMode);
      $("confirmPassword").required = signupMode;

      // Update Tab Styles with new theme colors
      $("signinTab").className = signupMode ? inactiveTabClass : activeTabClass;
      $("signupTab").className = signupMode ? activeTabClass : inactiveTabClass;

      $("message").className = "hidden";
      $("message").textContent = "";
    }

    function showMessage(text, type) {
      const el = $("message");
      el.textContent = text;
      // Using standard semantic colors for form errors/success so they are obvious
      el.className = type === "error"
        ? "text-sm px-4 py-3 rounded-xl bg-red-50 text-red-700 border border-red-200 block"
        : "text-sm px-4 py-3 rounded-xl bg-green-50 text-green-700 border border-green-200 block";
    }

    function firebaseMessage(error) {
      return ({
        "auth/invalid-credential": "Invalid email or password.",
        "auth/email-already-in-use": "An account already exists with this email.",
        "auth/weak-password": "Password must be at least 6 characters.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/network-request-failed": "Network error. Please check your internet connection."
      })[error.code] || error.message || "Authentication failed.";
    }

    $("signinTab").onclick = () => setMode("signin");
    $("signupTab").onclick = () => setMode("signup");

    setMode(mode);

    watchAuth(user => {
      if (user) {
        // After authentication, enter the secure CRM area.
        location.href = "clients.html";
      }
    });

    $("authForm").addEventListener("submit", async event => {
      event.preventDefault();

      const button = $("submitBtn");
      button.disabled = true;
      button.innerHTML = `
        <i data-lucide="loader-circle" class="animate-spin" style="width: 20px; height: 20px;"></i>
        <span>${mode === "signup" ? "Creating Account..." : "Signing In..."}</span>
      `;
      lucide.createIcons();

      try {
        const email = $("email").value.trim();
        const password = $("password").value;

        if (mode === "signup") {
          if (password !== $("confirmPassword").value) {
            throw new Error("Passwords do not match.");
          }

          const result = await signup(email, password);

          await saveUserProfile(result.user, {
            role: "user",
            createdAt: new Date().toISOString()
          });
        } else {
          await login(email, password);
        }

        showMessage(
          mode === "signup" ? "Account created successfully." : "Signed in successfully.",
          "success"
        );

      } catch (error) {
        showMessage(firebaseMessage(error), "error");
        button.disabled = false;
        button.innerHTML = `
          <span>${mode === "signup" ? "Create Account" : "Sign In"}</span>
          <i data-lucide="arrow-right" style="width: 20px; height: 20px;"></i>
        `;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
