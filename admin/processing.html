<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM | PROCESSING</title>

  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            navy: '#071d49',
            'navy-soft': '#102a5c',
            yellow: '#ffc51b',
            'yellow-dark': '#eab000',
            gray: '#f1f2f7',
            text: '#071d49',
          },
          boxShadow: {
            custom: '0 24px 45px rgba(7, 29, 73, .18)',
          }
        }
      }
    };
  </script>

  <!-- CSS Variables & Base Styles -->
  <style>
    :root {
      --navy: #071d49;
      --navy-soft: #102a5c;
      --yellow: #ffc51b;
      --yellow-dark: #eab000;
      --white: #ffffff;
      --gray: #f1f2f7;
      --text: #071d49;
      --shadow: 0 24px 45px rgba(7, 29, 73, .18);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--gray);
      color: var(--text);
      font-size: 18px; 
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <!-- STANDALONE COMPONENT (2 Rounds/Radii Applied) -->
  <main class="w-full max-w-sm">
    
    <!-- Outer Card: Round 1 (rounded-3xl) -->
    <div class="bg-white rounded-3xl p-8 shadow-custom border border-gray/60 text-center flex flex-col items-center">
      
      <!-- Icon Container: Round 2 (rounded-2xl) -->
      <div class="w-24 h-24 bg-gray rounded-2xl flex items-center justify-center shadow-inner mb-5">
        
        <!-- 
          DOTS SMALL SPINNER SVG 
          Change w-10 h-10 to w-5 h-5 for the exact 20x20px size 
        -->
        <svg class="animate-spin w-10 h-10" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <!-- Top Dot (Yellow) -->
          <circle cx="12" cy="3" r="1.75" class="fill-yellow" />
          
          <!-- Remaining 7 Dots (Navy) -->
          <circle cx="18.36" cy="5.64" r="1.75" class="fill-navy" />
          <circle cx="21" cy="12" r="1.75" class="fill-navy" />
          <circle cx="18.36" cy="18.36" r="1.75" class="fill-navy" />
          <circle cx="12" cy="21" r="1.75" class="fill-navy" />
          <circle cx="5.64" cy="18.36" r="1.75" class="fill-navy" />
          <circle cx="3" cy="12" r="1.75" class="fill-navy" />
          <circle cx="5.64" cy="5.64" r="1.75" class="fill-navy" />
        </svg>

      </div>

      <h3 class="text-lg font-bold text-navy">Processing . .</h3>
      <p class="text-sm font-medium text-navy-soft mt-1">Please Wait</p>
      
    </div>

  </main>

</body>
</html>
