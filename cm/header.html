<!-- header.html -->
<header class="bg-white border-b border-gray/60 sticky top-0 z-40 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo & Brand -->
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-navy flex items-center justify-center text-yellow shadow-md overflow-hidden">
          <!-- Fallback icon if logo.png fails -->
          <img src="assets/logo.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <i data-lucide="briefcase" class="hidden" style="width: 20px; height: 20px;"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-navy leading-tight">CM Business Flow</h1>
          <p class="text-xs text-navy-soft font-medium">Workspace</p>
        </div>
      </a>

      <!-- Right Actions: Search & Profile -->
      <div class="flex items-center space-x-4 relative">
        
        <!-- Search Button -->
        <button class="p-2 text-navy-soft hover:text-navy hover:bg-gray rounded-full transition-colors">
          <i data-lucide="search"></i>
        </button>

        <!-- Profile Dropdown Trigger -->
        <button id="profileBtn" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray border border-gray/80 text-navy hover:ring-2 hover:ring-yellow transition-all focus:outline-none">
          <i data-lucide="user"></i>
        </button>

        <!-- Dropdown Menu (Hidden by default, toggled via JS) -->
        <div id="profileMenu" class="hidden absolute right-0 top-12 mt-2 w-48 bg-white rounded-xl shadow-custom border border-gray/60 py-2">
          <a href="signin.html" class="flex items-center gap-2 px-4 py-2 text-sm text-navy hover:bg-gray transition-colors font-semibold">
            <i data-lucide="log-in" style="width: 16px; height: 16px;"></i> Login
          </a>
          <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors font-semibold border-t border-gray/50 mt-1 pt-3">
            <i data-lucide="log-out" style="width: 16px; height: 16px;"></i> Logout
          </a>
        </div>

      </div>
    </div>
  </div>
</header>

<!-- Simple script to toggle profile menu -->
<script>
  document.getElementById('profileBtn')?.addEventListener('click', function() {
    document.getElementById('profileMenu').classList.toggle('hidden');
  });
</script>
